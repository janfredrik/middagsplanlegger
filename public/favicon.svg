<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Cart body -->
  <path d="M4 8 L6.5 8 L9.5 22 L25 22 L28 11 L8.5 11" stroke="#1a1a2e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Cart grid lines -->
  <line x1="14" y1="11" x2="14.5" y2="21.5" stroke="#1a1a2e" stroke-width="1" stroke-linecap="round"/>
  <line x1="19" y1="11" x2="20" y2="21.5" stroke="#1a1a2e" stroke-width="1" stroke-linecap="round"/>
  <line x1="9" y1="16" x2="26.5" y2="16" stroke="#1a1a2e" stroke-width="1" stroke-linecap="round"/>
  <!-- Wheels -->
  <circle cx="11.5" cy="25" r="2" fill="#1a1a2e"/>
  <circle cx="11.5" cy="25" r="0.9" fill="white"/>
  <circle cx="23" cy="25" r="2" fill="#1a1a2e"/>
  <circle cx="23" cy="25" r="0.9" fill="white"/>
  <!-- Yellow pepper -->
  <ellipse cx="16" cy="9" rx="2.5" ry="4" fill="#f5c842" transform="rotate(-20, 16, 9)"/>
  <path d="M15 5.5 Q16 4.5 17 5" stroke="#2d6a1f" stroke-width="0.8" fill="none" stroke-linecap="round"/>
  <!-- Red pepper -->
  <ellipse cx="20" cy="10" rx="2.2" ry="3.8" fill="#e03030" transform="rotate(15, 20, 10)"/>
  <path d="M19.5 6.5 Q20.5 5.5 21.5 6" stroke="#2d6a1f" stroke-width="0.8" fill="none" stroke-linecap="round"/>
  <!-- Green zucchini -->
  <ellipse cx="12.5" cy="9.5" rx="1.5" ry="4.2" fill="#4caf50" transform="rotate(10, 12.5, 9.5)"/>
  <ellipse cx="12.5" cy="9.5" rx="0.6" ry="4.0" fill="#66bb6a" transform="rotate(10, 12.5, 9.5)"/>
  <path d="M12 5.5 Q12.5 4.5 13.5 5" stroke="#2d6a1f" stroke-width="0.8" fill="none" stroke-linecap="round"/>
  <!-- Orange carrot hint -->
  <ellipse cx="23.5" cy="10" rx="1.3" ry="3.2" fill="#f07820" transform="rotate(-10, 23.5, 10)"/>
  <path d="M22.8 7 Q23.5 6 24.2 7" stroke="#2d6a1f" stroke-width="0.9" fill="none" stroke-linecap="round"/>
